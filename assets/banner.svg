<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <text x="50%" y="40%" font-family="Arial, sans-serif" font-size="40" fill="white" font-weight="bold" text-anchor="middle" dominant-baseline="middle">Awesome Visitor Management</text>
  <text x="50%" y="70%" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" dominant-baseline="middle">Digital Check-In, Reception &amp; Workspace Security</text>
  <circle cx="100" cy="100" r="10" fill="white">
    <animate attributeName="r" values="10;20;10" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="100" r="10" fill="white">
    <animate attributeName="r" values="10;20;10" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0;1" dur="2.5s" repeatCount="indefinite" />
  </circle>
</svg>